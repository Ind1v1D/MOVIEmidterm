name: Deploy Study Desk to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Task3/sis3/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Task3/sis3
      - name: Build
        run: npm run build
        working-directory: Task3/sis3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Task3/sis3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
